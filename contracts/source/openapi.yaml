openapi: 3.1.0
info:
  title: SourceHarbor API
  version: 0.1.0
  description: API contract for subscriptions, ingest polling, jobs, videos and artifacts.
servers:
  - url: http://127.0.0.1:9000
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'

  /api/v1/subscriptions:
    get:
      operationId: listSubscriptions
      parameters:
        - in: query
          name: platform
          schema:
            $ref: '#/components/schemas/Platform'
        - in: query
          name: enabled_only
          schema:
            type: boolean
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
    post:
      operationId: upsertSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpsertRequest'
      responses:
        '200':
          description: Upsert result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionUpsertResponse'

  /api/v1/subscriptions/{id}:
    delete:
      operationId: removeSubscription
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /api/v1/subscriptions/batch-update-category:
    post:
      operationId: batchUpdateSubscriptionCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Batch category update result
          content:
            application/json:
              schema:
                type: object

  /api/v1/ingest/poll:
    post:
      operationId: pollIngest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPollRequest'
      responses:
        '202':
          description: Poll result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestPollResponse'

  /api/v1/ingest/runs:
    get:
      operationId: listIngestRuns
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: platform
          schema:
            $ref: '#/components/schemas/Platform'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Recent ingest runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngestRunSummary'

  /api/v1/ingest/runs/{run_id}:
    get:
      operationId: getIngestRun
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ingest run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRun'
        '404':
          description: Not found

  /api/v1/jobs/{job_id}:
    get:
      operationId: getJob
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Not found

  /api/v1/jobs/{job_id}/compare:
    get:
      operationId: compareJob
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job compare detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCompareResponse'
        '404':
          description: Not found

  /api/v1/knowledge/cards:
    get:
      operationId: listKnowledgeCards
      parameters:
        - in: query
          name: job_id
          schema:
            type: string
            format: uuid
        - in: query
          name: video_id
          schema:
            type: string
            format: uuid
        - in: query
          name: card_type
          schema:
            type: string
        - in: query
          name: topic_key
          schema:
            type: string
        - in: query
          name: claim_kind
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Knowledge cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeCard'

  /api/v1/jobs/{job_id}/knowledge-cards:
    get:
      operationId: getJobKnowledgeCards
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Knowledge cards derived from one job
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeCardResponse'
        '404':
          description: Not found

  /api/v1/retrieval/search:
    post:
      operationId: retrievalSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrievalSearchRequest'
      responses:
        '200':
          description: Retrieval search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalSearchResponse'

  /api/v1/computer-use/run:
    post:
      operationId: runComputerUse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerUseRunRequest'
      responses:
        '200':
          description: Computer use planning result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerUseRunResponse'
        '400':
          description: Invalid request payload

  /api/v1/health/providers:
    get:
      operationId: getProviderHealth
      parameters:
        - in: query
          name: window_hours
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
      responses:
        '200':
          description: Provider health rollup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHealthResponse'

  /api/v1/videos:
    get:
      operationId: listVideos
      parameters:
        - in: query
          name: platform
          schema:
            $ref: '#/components/schemas/Platform'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/JobStatus'
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Video list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'

  /api/v1/videos/process:
    post:
      operationId: processVideo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoProcessRequest'
      responses:
        '202':
          description: Process job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoProcessResponse'
        '503':
          description: Temporal unavailable

  /api/v1/artifacts/markdown:
    get:
      operationId: getArtifactMarkdown
      parameters:
        - in: query
          name: job_id
          schema:
            type: string
            format: uuid
        - in: query
          name: video_url
          schema:
            type: string
            minLength: 1
        - in: query
          name: include_meta
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Markdown artifact text (plain text by default, JSON when include_meta=true)
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactMarkdownWithMeta'
        '400':
          description: Missing query parameters
        '404':
          description: Artifact not found

  /api/v1/artifacts/assets:
    get:
      operationId: getArtifactAsset
      parameters:
        - in: query
          name: job_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Artifact asset binary payload
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Artifact asset not found

  /api/v1/workflows/run:
    post:
      operationId: runWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunRequest'
      responses:
        '200':
          description: Workflow run accepted/completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
        '502':
          description: Workflow execution failed
        '503':
          description: Temporal unavailable or workflow start failed

  /api/v1/notifications/config:
    get:
      operationId: getNotificationConfig
      responses:
        '200':
          description: Notification config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConfig'
    put:
      operationId: updateNotificationConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationConfigUpdateRequest'
      responses:
        '200':
          description: Updated notification config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConfig'

  /api/v1/notifications/test:
    post:
      operationId: sendNotificationTest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTestRequest'
      responses:
        '200':
          description: Test notification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSendResponse'
        '400':
          description: Bad request
        '503':
          description: Notification provider unavailable

  /api/v1/reports/daily/send:
    post:
      operationId: sendDailyReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyReportSendRequest'
      responses:
        '200':
          description: Daily report notification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportSendResponse'
        '400':
          description: Bad request
        '503':
          description: Notification provider unavailable

  /api/v1/notifications/category/send:
    post:
      operationId: sendCategoryNotification
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Category notification result
          content:
            application/json:
              schema:
                type: object

  /api/v1/feed/digests:
    get:
      operationId: getDigestFeed
      parameters:
        - in: query
          name: source
          schema:
            $ref: '#/components/schemas/Platform'
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: feedback
          schema:
            type: string
            enum: [saved, useful, noisy, dismissed, archived]
        - in: query
          name: sort
          schema:
            type: string
            enum: [recent, curated]
        - in: query
          name: sub
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: since
          schema:
            type: string
      responses:
        '200':
          description: Digest feed result
          content:
            application/json:
              schema:
                type: object

  /api/v1/feed/feedback:
    get:
      operationId: getFeedFeedback
      parameters:
        - in: query
          name: job_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Feed feedback state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedFeedback'
    put:
      operationId: putFeedFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedFeedbackUpdateRequest'
      responses:
        '200':
          description: Feed feedback updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedFeedback'

  /api/v1/ui-audit/run:
    post:
      operationId: runUiAudit
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: UI audit run started
          content:
            application/json:
              schema:
                type: object

  /api/v1/ui-audit/{run_id}:
    get:
      operationId: getUiAuditRun
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: UI audit run detail
          content:
            application/json:
              schema:
                type: object

  /api/v1/ui-audit/{run_id}/findings:
    get:
      operationId: listUiAuditFindings
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: UI audit findings
          content:
            application/json:
              schema:
                type: object

  /api/v1/ui-audit/{run_id}/artifact:
    get:
      operationId: getUiAuditArtifact
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: UI audit artifact
          content:
            application/json:
              schema:
                type: object

  /api/v1/ui-audit/{run_id}/autofix:
    post:
      operationId: runUiAuditAutofix
      parameters:
        - in: path
          name: run_id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: UI audit autofix plan
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    HealthzResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Platform:
      type: string
      enum: [bilibili, youtube]

    SourceType:
      type: string
      enum: [bilibili_uid, youtube_channel_id, url]

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    Subscription:
      type: object
      required: [id, platform, source_type, source_value, rsshub_route, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/Platform'
        source_type:
          $ref: '#/components/schemas/SourceType'
        source_value:
          type: string
        rsshub_route:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionUpsertRequest:
      type: object
      required: [platform, source_type, source_value]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        source_type:
          $ref: '#/components/schemas/SourceType'
        source_value:
          type: string
        rsshub_route:
          type: string
        enabled:
          type: boolean

    SubscriptionUpsertResponse:
      type: object
      required: [subscription, created]
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
        created:
          type: boolean

    IngestPollRequest:
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/Platform'
        max_new_videos:
          type: integer
          minimum: 1
          default: 50

    IngestCandidate:
      type: object
      required: [video_id, platform, video_uid, source_url, job_id]
      properties:
        video_id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/Platform'
        video_uid:
          type: string
        source_url:
          type: string
        title:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        job_id:
          type: string
          format: uuid

    IngestPollResponse:
      type: object
      required: [run_id, status, enqueued, candidates]
      properties:
        run_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [queued, running, succeeded, failed, skipped]
        enqueued:
          type: integer
          minimum: 0
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/IngestCandidate'

    IngestRunItem:
      type: object
      required:
        [id, platform, video_uid, source_url, content_type, item_status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
          nullable: true
        video_id:
          type: string
          format: uuid
          nullable: true
        job_id:
          type: string
          format: uuid
          nullable: true
        ingest_event_id:
          type: string
          format: uuid
          nullable: true
        platform:
          $ref: '#/components/schemas/Platform'
        video_uid:
          type: string
        source_url:
          type: string
        title:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        entry_hash:
          type: string
          nullable: true
        pipeline_mode:
          type: string
          nullable: true
        content_type:
          type: string
          enum: [video, article]
        item_status:
          type: string
          enum: [queued, deduped, skipped]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IngestRunSummary:
      type: object
      required:
        [
          id,
          max_new_videos,
          status,
          jobs_created,
          candidates_count,
          feeds_polled,
          entries_fetched,
          entries_normalized,
          ingest_events_created,
          ingest_event_duplicates,
          job_duplicates,
          created_at,
          updated_at
        ]
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
          nullable: true
        workflow_id:
          type: string
          nullable: true
        platform:
          $ref: '#/components/schemas/Platform'
          nullable: true
        max_new_videos:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [queued, running, succeeded, failed, skipped]
        jobs_created:
          type: integer
          minimum: 0
        candidates_count:
          type: integer
          minimum: 0
        feeds_polled:
          type: integer
          minimum: 0
        entries_fetched:
          type: integer
          minimum: 0
        entries_normalized:
          type: integer
          minimum: 0
        ingest_events_created:
          type: integer
          minimum: 0
        ingest_event_duplicates:
          type: integer
          minimum: 0
        job_duplicates:
          type: integer
          minimum: 0
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    IngestRun:
      allOf:
        - $ref: '#/components/schemas/IngestRunSummary'
        - type: object
          required: [items]
          properties:
            requested_by:
              type: string
              nullable: true
            requested_trace_id:
              type: string
              nullable: true
            filters_json:
              type: object
              nullable: true
            items:
              type: array
              items:
                $ref: '#/components/schemas/IngestRunItem'

    JobStep:
      type: object
      required: [name, status, attempt]
      properties:
        name:
          type: string
        status:
          type: string
        attempt:
          type: integer
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        error:
          nullable: true

    JobStepDetail:
      type: object
      required: [name, status, attempt]
      properties:
        name:
          type: string
        status:
          type: string
        attempt:
          type: integer
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        error:
          nullable: true

    JobCompareStats:
      type: object
      required: [added_lines, removed_lines, changed]
      properties:
        added_lines:
          type: integer
        removed_lines:
          type: integer
        changed:
          type: boolean

    JobCompareResponse:
      type: object
      required: [job_id, has_previous, diff_markdown, stats]
      properties:
        job_id:
          type: string
        previous_job_id:
          type:
            - string
            - 'null'
        has_previous:
          type: boolean
        current_digest:
          type:
            - string
            - 'null'
        previous_digest:
          type:
            - string
            - 'null'
        diff_markdown:
          type: string
        stats:
          $ref: '#/components/schemas/JobCompareStats'

    KnowledgeCard:
      type: object
      required:
        [id, job_id, video_id, card_type, source_section, body, order_index, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        card_type:
          type: string
          enum: [summary, takeaway, action]
        source_section:
          type: string
        title:
          type:
            - string
            - 'null'
        body:
          type: string
        order_index:
          type: integer
        metadata_json:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KnowledgeCardResponse:
      type: object
      required: [card_type, title, body, source_section, order_index]
      properties:
        card_type:
          type: string
        title:
          type: string
        body:
          type: string
        source_section:
          type: string
        order_index:
          type: integer

    FeedFeedback:
      type: object
      required: [job_id, saved, feedback_label, exists, created_at, updated_at]
      properties:
        job_id:
          type: string
          format: uuid
        saved:
          type: boolean
        feedback_label:
          type:
            - string
            - 'null'
          enum: [useful, noisy, dismissed, archived, null]
        exists:
          type: boolean
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time

    FeedFeedbackUpdateRequest:
      type: object
      required: [job_id, saved]
      properties:
        job_id:
          type: string
          format: uuid
        saved:
          type: boolean
        feedback_label:
          type:
            - string
            - 'null'
          enum: [useful, noisy, dismissed, archived, null]

    RetrievalSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        filters:
          type: object
          default: {}
